<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SDET Grind FYP | StageTimePNW ➔ Costco Travel QE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-alt: #f8f9fa;
      --border: #e0e3e7;
      --text: #1f1f1f;
      --text-secondary: #5f6368;
      --blue: #0b57d0;
      --blue-soft: #d3e3fd;
      --green: #146c2e;
      --green-soft: #e6f4ea;
      --purple-soft: #f0e9fb;
      --purple: #7627bb;
      --amber-soft: #fef7e0;
      --amber: #b26a00;
      --red: #b3261e;
      --red-soft: #fce8e6;
      --radius-card: 16px;
      --shadow-card: 0 1px 2px rgba(60,64,67,0.08), 0 1px 3px 1px rgba(60,64,67,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Google Sans Text", "Google Sans", Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 16px; min-height: 100vh; }
    .container { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

    /* Header */
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 1px solid var(--border); padding-bottom: 18px; }
    .logo-badge { display: flex; align-items: center; gap: 14px; }
    .tt-logo { font-family: "Google Sans", sans-serif; font-size: 1.6rem; font-weight: 500; letter-spacing: -0.5px; }
    .tt-logo .g-blue { color: #4285F4; } .tt-logo .g-red { color: #EA4335; } .tt-logo .g-yellow { color: #FBBC04; } .tt-logo .g-green { color: #34A853; }
    .header-title { font-family: "Google Sans", sans-serif; font-weight: 500; font-size: 1.05rem; color: var(--text); }
    .sub-title { color: var(--text-secondary); font-size: 0.85rem; font-weight: 400; }

    .badge-row { display: flex; gap: 12px; }
    .badge { background: var(--surface-alt); border: 1px solid var(--border); padding: 8px 16px; border-radius: 100px; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 8px; color: var(--text-secondary); }
    .badge.cyan { color: var(--blue); background: var(--blue-soft); border-color: transparent; }
    .badge.pink { color: var(--amber); background: var(--amber-soft); border-color: transparent; }

    /* Readiness Progress Bar */
    .progress-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 20px; box-shadow: var(--shadow-card); }
    .progress-header { display: flex; justify-content: space-between; margin-bottom: 12px; font-family: "Google Sans", sans-serif; font-size: 0.95rem; font-weight: 500; color: var(--text); }
    .progress-bar-bg { width: 100%; height: 8px; background: #e8eaed; border-radius: 100px; overflow: hidden; position: relative; }
    .progress-bar-fill { height: 100%; width: 0%; background: var(--blue); border-radius: 100px; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

    /* Grid */
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); padding: 20px; display: flex; flex-direction: column; gap: 16px; transition: box-shadow 0.2s; }
    .card:hover { box-shadow: var(--shadow-card); }
    .card-title { font-family: "Google Sans", sans-serif; font-size: 1.05rem; font-weight: 500; color: var(--text); display: flex; align-items: center; justify-content: space-between; }
    .card-title span.tag { font-size: 0.72rem; padding: 4px 10px; border-radius: 100px; background: var(--blue-soft); color: var(--blue); font-weight: 500; letter-spacing: 0.3px; }

    /* Buttons */
    button { cursor: pointer; border: none; border-radius: 100px; font-family: "Google Sans", sans-serif; font-weight: 500; padding: 10px 24px; font-size: 0.9rem; transition: box-shadow 0.2s, background 0.2s; letter-spacing: 0.2px; }
    button:hover { box-shadow: 0 1px 3px rgba(60,64,67,0.24); }
    button:active { box-shadow: none; }
    .btn-save { background: var(--blue); color: #fff; width: 100%; }
    .btn-save:hover { background: #0a4dbb; }

    /* Syllabus */
    .checklist { display: flex; flex-direction: column; gap: 10px; max-height: 440px; overflow-y: auto; padding-right: 4px; }
    .check-item { display: flex; align-items: flex-start; gap: 12px; background: var(--surface); padding: 12px; border-radius: 12px; border: 1px solid var(--border); transition: background 0.15s, border-color 0.15s; }
    .check-item:hover { background: var(--surface-alt); border-color: #c4c7cc; }
    .check-item input { margin-top: 3px; accent-color: var(--blue); width: 18px; height: 18px; cursor: pointer; }
    .check-label { font-size: 0.88rem; line-height: 1.45; color: var(--text-secondary); }
    .check-label strong { color: var(--text); display: block; font-family: "Google Sans", sans-serif; font-weight: 500; font-size: 0.92rem; margin-bottom: 2px; }

    /* Inputs */
    .log-form { display: flex; flex-direction: column; gap: 12px; }
    input, textarea { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 12px 14px; font-size: 0.9rem; outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
    input::placeholder, textarea::placeholder { color: #80868b; }
    input:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
    textarea { resize: vertical; min-height: 90px; }

    .history-list { display: flex; flex-direction: column; gap: 12px; max-height: 280px; overflow-y: auto; }
    .history-card { background: var(--surface-alt); border: 1px solid var(--border); border-left: 4px solid var(--blue); padding: 14px; border-radius: 12px; font-size: 0.88rem; }
    .history-header { display: flex; justify-content: space-between; font-family: "Google Sans", sans-serif; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    .history-body { color: var(--text-secondary); white-space: pre-line; line-height: 1.45; }

    /* Scrollbars */
    .checklist::-webkit-scrollbar, .history-list::-webkit-scrollbar { width: 8px; }
    .checklist::-webkit-scrollbar-thumb, .history-list::-webkit-scrollbar-thumb { background: #dadce0; border-radius: 100px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo-badge">
        <div class="tt-logo"><span class="g-blue">Stage</span><span class="g-red">Time</span><span class="g-yellow">P</span><span class="g-blue">N</span><span class="g-green">W</span></div>
        <div>
          <div class="header-title">Costco Travel QE Roadmap</div>
          <div class="sub-title">#SDETGrind • #AutomationEngineer • #ShiftLeft</div>
        </div>
      </div>
      <div class="badge-row">
        <div class="badge pink">🔥 <span id="streakCount">1</span> DAY STREAK</div>
        <div class="badge cyan">⏱️ <span id="totalHours">0.0</span> HRS LOGGED</div>
      </div>
    </header>

    <!-- Costco Readiness Bar -->
    <div class="progress-section">
      <div class="progress-header">
        <span>🎯 Costco Travel QE Readiness Score</span>
        <span id="readinessScore" style="color: var(--blue); font-weight: 700;">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="readinessFill"></div>
      </div>
    </div>

    <!-- Grid Row 1 -->
    <div class="dashboard-grid">
      <!-- End of Day Form -->
      <div class="card" style="grid-column: 1 / -1;">
        <div class="card-title">
          <span>📝 Daily Checkout Log</span>
          <span class="tag" style="background: var(--red-soft); color: var(--red);">END OF SESSION</span>
        </div>
        <div class="log-form">
          <input type="text" id="logTopic" placeholder="Topic (e.g. Day 1: Shift-Left & Modifiers)" />
          <textarea id="logSummary" placeholder="What did we accomplish today? Key concepts mastered..."></textarea>
          <button class="btn-save" onclick="saveDailyLog()">⚡ Save Checkout Log</button>
        </div>
      </div>
    </div>

    <!-- Grid Row 2 -->
    <div class="dashboard-grid">
      <!-- Syllabus -->
      <div class="card">
        <div class="card-title">
          <span>📋 Capstone Syllabus & Skills</span>
          <span class="tag">COSTCO QE</span>
        </div>
        <div class="checklist" id="checklistContainer"></div>
      </div>

      <!-- History Log -->
      <div class="card">
        <div class="card-title">
          <span>📜 Daily Checkout History</span>
          <span class="tag">PROGRESS</span>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>
  </div>

  <script>
    const SYLLABUS = [
      { id: "m1_duplicate_bug", title: "App Architecture", desc: "Diagnosed & fixed duplicate Rickshaw header bug in SwiftUI", done: true },
      { id: "m1_sorting_logic", title: "Data Parsing", desc: "Implemented time parsing & chronological show sorting in OpenMic.swift", done: true },
      { id: "m1_shift_left", title: "Lesson 1: Shift-Left", desc: "Mastered SwiftUI Box Rule & added .accessibilityIdentifier tags", done: true },
      { id: "m2_env_setup", title: "Lesson 2: Environment", desc: "Verify Node.js, Appium server, and XCUITest driver setup", done: false },
      { id: "m2_wdio_init", title: "Lesson 2: Test Harness", desc: "Initialize WebdriverIO (JS) test project & configure iOS capabilities", done: false },
      { id: "m3_pom_design", title: "Lesson 3: Page Object Model", desc: "Architect RickshawPage.js & MapPage.js using accessibility selectors", done: false },
      { id: "m3_first_test", title: "Lesson 3: Live UI Test", desc: "Run automated Rickshaw form validation test on iOS Simulator", done: false },
      { id: "m4_db_assertions", title: "Lesson 4: DB Verification", desc: "Query Supabase PostgreSQL in JS to assert signup payload insertion", done: false },
      { id: "m5_cicd_pipeline", title: "Lesson 5: CI/CD & DevOps", desc: "Build GitHub Actions automated regression pipeline with HTML reports", done: false },
      { id: "m6_interview_star", title: "Lesson 6: Interview Mastery", desc: "Master Costco Travel STAR behavioral & technical architecture defense", done: false }
    ];

    let state = JSON.parse(localStorage.getItem('sdet_tracker_state_tt')) || {
      seconds: 0,
      totalSeconds: 0,
      streak: 1,
      lastActiveDate: new Date().toDateString(),
      syllabus: SYLLABUS,
      logs: []
    };

    function init() {
      if (!state.syllabus || state.syllabus.length !== SYLLABUS.length) {
        state.syllabus = SYLLABUS;
      }
      renderChecklist();
      renderLogs();
      updateScore();
      updateBadges();
    }

    function renderChecklist() {
      const container = document.getElementById('checklistContainer');
      container.innerHTML = state.syllabus.map((item, idx) => `
        <div class="check-item">
          <input type="checkbox" id="${item.id}" ${item.done ? 'checked' : ''} onchange="toggleCheck(${idx})" />
          <div class="check-label">
            <strong>${item.title}</strong>
            ${item.desc}
          </div>
        </div>
      `).join('');
    }

    function toggleCheck(idx) {
      state.syllabus[idx].done = !state.syllabus[idx].done;
      saveState();
      updateScore();
    }

    function updateScore() {
      const completed = state.syllabus.filter(i => i.done).length;
      const total = state.syllabus.length;
      const pct = Math.round((completed / total) * 100);
      document.getElementById('readinessScore').innerText = pct + '%';
      document.getElementById('readinessFill').style.width = pct + '%';
    }

    function updateBadges() {
      const totalHours = (state.totalSeconds / 3600).toFixed(1);
      document.getElementById('totalHours').innerText = totalHours;
      document.getElementById('streakCount').innerText = state.streak;
    }

    function saveDailyLog() {
      const topic = document.getElementById('logTopic').value.trim();
      const summary = document.getElementById('logSummary').value.trim();
      if (!topic || !summary) return alert('Please enter both a topic and summary!');

      const newLog = {
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
        topic,
        summary
      };

      state.logs.unshift(newLog);
      document.getElementById('logTopic').value = '';
      document.getElementById('logSummary').value = '';
      saveState();
      renderLogs();
      alert('🔥 Checkout Log Saved! 100% on the FYP!');
    }

    function renderLogs() {
      const list = document.getElementById('historyList');
      if (state.logs.length === 0) {
        list.innerHTML = '<p style="color: var(--text-secondary); font-size: 0.85rem;">No checkout logs saved yet. Lock in today\'s work above!</p>';
        return;
      }
      list.innerHTML = state.logs.map(log => `
        <div class="history-card">
          <div class="history-header">
            <span>${log.date} — ${log.topic}</span>
            ${log.timeSpent ? `<span style="color: var(--blue); font-size: 0.8rem;">⏱️ ${log.timeSpent}</span>` : ''}
          </div>
          <div class="history-body">${log.summary}</div>
        </div>
      `).join('');
    }

    function saveState() {
      localStorage.setItem('sdet_tracker_state_tt', JSON.stringify(state));
      updateBadges();
    }

    init();
  </script>
</body>
</html>
